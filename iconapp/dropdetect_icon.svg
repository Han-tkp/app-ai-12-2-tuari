<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1E21"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- Background: D-style dark with rounded corners -->
  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Grid lines (D-style) - subtle -->
    <line x1="0" y1="85" x2="512" y2="85" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="0" y1="170" x2="512" y2="170" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="0" y1="255" x2="512" y2="255" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="0" y1="425" x2="512" y2="425" stroke="#2A2A2E" stroke-width="1.2"/>

    <line x1="85" y1="0" x2="85" y2="512" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="170" y1="0" x2="170" y2="512" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="255" y1="0" x2="255" y2="512" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="340" y1="0" x2="340" y2="512" stroke="#2A2A2E" stroke-width="1.2"/>
    <line x1="425" y1="0" x2="425" y2="512" stroke="#2A2A2E" stroke-width="1.2"/>

    <!-- Subtle corner grid dots -->
    <circle cx="85"  cy="85"  r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="170" cy="85"  r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="340" cy="85"  r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="425" cy="85"  r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="85"  cy="170" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="425" cy="170" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="85"  cy="340" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="425" cy="340" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="85"  cy="425" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="170" cy="425" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="340" cy="425" r="2" fill="#3F3F46" opacity="0.5"/>
    <circle cx="425" cy="425" r="2" fill="#3F3F46" opacity="0.5"/>

    <!-- === B-style: Microscope lens === -->

    <!-- Outer lens ring (glow) -->
    <circle cx="248" cy="252" r="148" fill="none" stroke="#2563EB" stroke-width="6" opacity="0.12"/>

    <!-- Main lens ring -->
    <circle cx="248" cy="252" r="136" fill="none" stroke="#3B82F6" stroke-width="8" opacity="0.7"/>

    <!-- Inner lens ring -->
    <circle cx="248" cy="252" r="108" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.2"/>

    <!-- Lens glass area (subtle tint) -->
    <circle cx="248" cy="252" r="132" fill="#2563EB" opacity="0.06"/>

    <!-- === Droplets inside lens with D-style bounding boxes === -->

    <!-- Droplet 1 (large) -->
    <circle cx="280" cy="270" r="32" fill="#2563EB" opacity="0.75"/>
    <circle cx="273" cy="258" r="8" fill="#60A5FA" opacity="0.3"/>
    <rect x="242" y="232" width="76" height="76" rx="6" fill="none" stroke="#60A5FA" stroke-width="3"/>

    <!-- Droplet 2 (medium) -->
    <circle cx="196" cy="210" r="24" fill="#2563EB" opacity="0.65"/>
    <circle cx="190" cy="200" r="6" fill="#60A5FA" opacity="0.25"/>
    <rect x="166" y="180" width="60" height="60" rx="5" fill="none" stroke="#60A5FA" stroke-width="2.5"/>

    <!-- Droplet 3 (small) -->
    <circle cx="200" cy="310" r="16" fill="#2563EB" opacity="0.55"/>
    <rect x="179" y="289" width="42" height="42" rx="4" fill="none" stroke="#60A5FA" stroke-width="2"/>

    <!-- Droplet 4 (tiny) -->
    <circle cx="310" cy="200" r="14" fill="#2563EB" opacity="0.5"/>
    <rect x="292" y="182" width="36" height="36" rx="4" fill="none" stroke="#60A5FA" stroke-width="2"/>

    <!-- Droplet 5 (extra small, edge) -->
    <circle cx="310" cy="330" r="11" fill="#2563EB" opacity="0.45"/>
    <rect x="295" y="315" width="30" height="30" rx="3" fill="none" stroke="#60A5FA" stroke-width="1.8"/>

    <!-- Detection count badge -->
    <rect x="332" y="150" width="48" height="28" rx="6" fill="#2563EB" opacity="0.9"/>
    <text x="356" y="170" font-family="monospace" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text>

    <!-- Lens handle -->
    <line x1="348" y1="358" x2="420" y2="430" stroke="#52525B" stroke-width="22" stroke-linecap="round"/>
    <line x1="348" y1="358" x2="420" y2="430" stroke="#71717A" stroke-width="14" stroke-linecap="round"/>
    <line x1="350" y1="358" x2="416" y2="424" stroke="#8B8B94" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

    <!-- Small accent: crosshair lines on lens edge -->
    <line x1="248" y1="114" x2="248" y2="130" stroke="#93C5FD" stroke-width="2" opacity="0.4"/>
    <line x1="248" y1="374" x2="248" y2="390" stroke="#93C5FD" stroke-width="2" opacity="0.4"/>
    <line x1="110" y1="252" x2="126" y2="252" stroke="#93C5FD" stroke-width="2" opacity="0.4"/>
    <line x1="370" y1="252" x2="386" y2="252" stroke="#93C5FD" stroke-width="2" opacity="0.4"/>

  </g>
</svg>